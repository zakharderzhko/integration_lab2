services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  forecast-api:
    build:
      context: .
      dockerfile: forecast-service/Dockerfile
    environment:
      MODEL_VERSION: ${MODEL_VERSION}
    # ПОРТИ ВИДАЛЕНО ЗГІДНО З ВИМОГАМИ ТАСКИ 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  orders-api:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      FORECAST_URL: http://forecast-api:8001
      FORECAST_TIMEOUT: ${FORECAST_TIMEOUT}
    ports:
      - "${ORDERS_PORT:-8000}:8000"
    secrets:
      - db_password
      - jwt_secret_key
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password
  jwt_secret_key:
    file: ./secrets/jwt_secret_key